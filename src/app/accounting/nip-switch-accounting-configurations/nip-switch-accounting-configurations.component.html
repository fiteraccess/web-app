<div class="layout-row align-end container m-b-20">
  <button mat-raised-button color="primary" [routerLink]="['create']">
    {{ 'labels.buttons.Add' | translate }} NIP Switch Accounting Configuration
  </button>
</div>

<div class="mat-elevation-z8 container">
  <table mat-table [dataSource]="dataSource" matSort>
    <ng-container matColumnDef="switchId"
      ><th mat-header-cell *matHeaderCellDef mat-sort-header>Switch ID</th>
      <td mat-cell *matCellDef="let configuration">{{ configuration.switchId }}</td></ng-container
    >
    <ng-container matColumnDef="direction"
      ><th mat-header-cell *matHeaderCellDef mat-sort-header>Direction</th>
      <td mat-cell *matCellDef="let configuration">{{ configuration.direction }}</td></ng-container
    >
    <ng-container matColumnDef="mappings"
      ><th mat-header-cell *matHeaderCellDef mat-sort-header>GL Mappings</th>
      <td mat-cell *matCellDef="let configuration">{{ mappingsSummary(configuration) }}</td></ng-container
    >
    <ng-container matColumnDef="active"
      ><th mat-header-cell *matHeaderCellDef mat-sort-header>{{ 'labels.inputs.Active' | translate }}</th>
      <td mat-cell *matCellDef="let configuration">
        {{ (configuration.active ? 'labels.commons.Yes' : 'labels.commons.No') | translate }}
      </td></ng-container
    >
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr
      mat-row
      *matRowDef="let row; columns: displayedColumns"
      [routerLink]="['view', row.switchId]"
      class="select-row"
    ></tr>
  </table>
  <mat-paginator [pageSizeOptions]="[10, 25]" showFirstLastButtons></mat-paginator>
</div>
