@if (text(); as value) {
  <span
    class="ops-clamp"
    role="button"
    tabindex="0"
    [class.ops-clamp-open]="open()"
    [attr.title]="value"
    [attr.aria-expanded]="open()"
    (click)="toggle()"
    (keydown.enter)="toggle()"
    >{{ value }}</span
  >
} @else {
  —
}
