@if (icon(); as icon) {
  <mat-icon
    [class]="'ops-mark-icon ' + markClass()"
    role="img"
    [attr.aria-label]="'labels.text.' + name() | translate"
    [attr.data-mark]="mark()"
    >{{ icon }}</mat-icon
  >
}
